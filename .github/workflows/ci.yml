name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-checks:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oryn
          POSTGRES_PASSWORD: oryn_test_secret
          POSTGRES_DB: oryn_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Go Vet & Static Analysis
        working-directory: ./backend
        run: go vet ./...

      - name: Run Backend Tests
        working-directory: ./backend
        env:
          APP_ENV: test
          LOG_LEVEL: error
          DATABASE_URL: postgres://oryn:oryn_test_secret@localhost:5432/oryn_test_db?sslmode=disable
          REDIS_ADDR: localhost:6379
          JWT_SECRET: test_secret_key_minimum_32_chars_for_security_testing
        run: go test -v -race -coverprofile=coverage.txt ./...

  frontend-checks:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend Build Verification
        working-directory: ./frontend
        run: npm run build
